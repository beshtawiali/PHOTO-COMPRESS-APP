workflows:
  android-aab-build:
    name: Android App Bundle (AAB) Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      android_signing:
        - ali-bashtawy-upload
      vars:
        PACKAGE_NAME: "com.tayf.photocompressor"
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Verify and fix Gradle wrapper
        script: |
          chmod +x gradlew
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "gradle-wrapper.jar is missing or corrupted, restoring valid wrapper jar..."
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || \
            curl -sSL "https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/9.3.1/gradle-wrapper-9.3.1.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
      - name: Build Android App Bundle
        script: |
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
